[workspace]
resolver = "2"
members = ["crates/fission-plugin-protocol", "crates/fission-plugin-sdk", "crates/fission-plugin-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fission-plugin-protocol = { path = "crates/fission-plugin-protocol" }
